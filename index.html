<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
     <meta name = "viewport" content="width=device-width", initial-scale = 1.0">
     <title> Registration Form </title>
</head>
 
<body>
 
    <h2>
 
        Registration Form
    </h2>
 
    <form action = '#' method = "post">
 
        <label for = "fullname">Full Name:</label><br>
        <input type = "text" id = "fullname" name = "fullname" required><br><br>
        <input for = "email">Email:</label><br>
        <input type = "email" id = "email" name = "email" required><br><br>
        <label for = "phone">Phone Number:</label><br>
        <input type = "tel" id = "phone" name = "phone" required><br><br>
 
        <label>Gender:</label><br>
        <input type = "radio" id = "male" name = "gender" value = "Male">
        <label for = "male">Male</label>
 
        <input type = "radio" id = "female" name = "gender" value = "Female">
        <label for = "female">Female</label>
 
        <input type = "radio" id = "other" name = "gender" value = "Other">
        <label for = "other">OTher</label><br><br>
 
        <input for = "dob">Date of Birth:</label><br>
        <label type = "date" id = "dob" name = "dob"><br><br>
 
        <input for = "password">Password:</label><br>
        <label type = "password" id = "password" name = "password" required><br><br>
 
        <input for = "confirmpassword">Confirm Password:</label><br>
        <label type = "password" id = "confirmpassword" name = "confirmpassword" required><br><br>
       
        <label for = "address">Address:</label><br>
        <textarea type = "address" id = "address" name = "address" rows = "4"></textarea><br><br>
 
        <label for = "department">Department</label><br>
        <select id = "department" name = "department">
        <option value = "CSE">CSE</option>
        <option value = "EEE">EEE</option>
        <option value = "BBA">BBA</option>
        <option value = "English">CSE</option>
        </select><br><br>
 
        <input type = "checkbox" id = "terms" name = "terms" required>
        <label for = "terms"> I agree to the Terms and Condition</label><br><br>
 
        <input type = "submit" value = "Register" ;>
        <input type = "reset" value = "Reset" ;>
 
 
    </form>
</body>
</html>
